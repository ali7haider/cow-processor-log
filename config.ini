[files]
# Path to the Afimilk log file
log_file_path = C:\Program Files\Afimilk\Logs\RTC\MILKINGPARLOR\RTC_MILKINGPARLOR.log
id_mapping_csv = C:\Users\Digital Zone\Downloads\map.csv

[processing]
# How often to check for new log entries (seconds)
check_interval = 3

# Maximum size of circular queue
queue_size = 100

# Transmission offset (number of stalls to wait before transmitting)
transmission_offset = 60

[network]
# RevPi connection details
revpi_host = 192.168.1.100
revpi_port = 8080

[logging]
# Logging configuration
level = INFO
file = cow_processor.log
max_size_mb = 10
backup_count = 5